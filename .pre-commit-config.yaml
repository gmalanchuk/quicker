repos:
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: isort src/.
        language: python
        types: [ python ]
        pass_filenames: false

      - id: black
        name: black
        entry: black src/.
        language: python
        types: [ python ]
        pass_filenames: false

      - id: flake8
        name: flake8
        entry: flake8 --config=src/.flake8
        language: python
        types: [ python ]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: mypy --config-file=src/mypy.ini .
        language: python
        types: [ python ]
        pass_filenames: false
